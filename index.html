<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Invitation ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
    background:#ff9ec4;
}

/* container */
.container{
    text-align:center;
    color:white;
}

h1{
    margin-bottom:20px;
}

/* buttons */
button{
    padding:15px 25px;
    font-size:20px;
    margin:10px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

#yes{
    background:#ff1493;
    color:white;
}

#no{
    background:white;
    color:#ff1493;
    position:absolute;
}

/* modal */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    color:black;
}

.modal-content img{
    width:300px;
    border-radius:10px;
    margin-top:10px;
}

/* full screen button */
.fs-btn{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:15px;
    background:#ff1493;
    color:white;
    cursor:pointer;
}

/* fullscreen image */
.fullscreen-img{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
    z-index:10000;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <h1>🎂 Can I celebrate your birthday with you? ❤️</h1>

    <button id="yes">YES ❤️</button>
    <button id="no">NO 😅</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2>YAAAYYY! HAPPY BIRTHDAY 🎉</h2>
        <p>Here's our itinerary 💕</p>

        <img src="./itinerary.jpg" alt="itinerary">

        <button class="fs-btn" onclick="openFullScreen()">
            View Full Screen 🖼️
        </button>
    </div>
</div>

<script>

// YES → open modal
document.getElementById("yes").onclick = function(){
    document.getElementById("modal").style.display = "flex";
};

// NO → runaway button
document.getElementById("no").addEventListener("mouseover", function(){
    this.style.left = Math.random()*300 + "px";
    this.style.top = Math.random()*300 + "px";
});

// FULL SCREEN IMAGE
function openFullScreen(){
    const img = document.createElement("img");
    img.src = "./itinerary.jpg";
    img.className = "fullscreen-img";

    img.onclick = function(){
        img.remove();
    };

    document.body.appendChild(img);
}

</script>

</body>
</html>
