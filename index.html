<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Invitation ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ff9ec4,#ffd6e8);
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    z-index:2;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:30px;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{transform:scale(1);}
    to{
        transform:scale(1.05);
        text-shadow:0 0 20px white;
    }
}

button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yes{
    background:#ff1493;
    color:white;
}

#yes:hover{
    transform:scale(1.15);
}

#no{
    background:white;
    color:#ff1493;
    position:absolute;
}

/* Hearts */
.heart{
    position:absolute;
    color:red;
    animation: float 8s linear infinite;
    opacity:0.7;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}

/* Success Screen */
.success{
    color:white;
    text-align:center;
    animation: pop 1s ease;
}

@keyframes pop{
    from{
        transform:scale(0);
    }
    to{
        transform:scale(1);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎂 Can you spend your Birthday with me, Arch. Alex? ❤️</h1>

    <button id="yes">Yes ❤️</button>
    <button id="no">No 😅</button>
</div>

<script>

// Floating Hearts
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(createHeart,300);

// Moving No Button
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{
    const x=Math.random()*(window.innerWidth-150);
    const y=Math.random()*(window.innerHeight-100);

    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
});

// Yes Button
document.getElementById("yes").addEventListener("click",()=>{

    document.body.innerHTML=`
    <div class="success">
        <h1>YAAAYYY! ❤️🎉</h1>
        <br>
        <h2>Thank you Arch. Alex! 🌹</h2>
        <br>
        <p>I can't wait to celebrate your birthday with you. 💕</p>
    </div>
    `;

});
</script>

</body>
</html>
