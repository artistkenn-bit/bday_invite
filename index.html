<!DOCTYPE html>
<html>
<head>
<title>Test Invite</title>

<style>
body{
    font-family:sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ff9ec4;
}

button{
    padding:15px 30px;
    font-size:20px;
    margin:10px;
    border-radius:20px;
    border:none;
    cursor:pointer;
}

#no{
    position:absolute;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.modal-content img{
    width:300px;
}
</style>
</head>

<body>

<button id="yes">YES ❤️</button>
<button id="no">NO 😅</button>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2>YAY! 🎉</h2>
        <img src="./itinerary.jpg">
    </div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const modal = document.getElementById("modal");

// THIS IS THE KEY FIX
yesBtn.onclick = function(){
    modal.style.display = "flex";
};

// NO button runaway (optional)
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", ()=>{
    noBtn.style.left = Math.random()*300 + "px";
    noBtn.style.top = Math.random()*300 + "px";
});
</script>

</body>
</html>
