<!DOCTYPE html>
<html>
<head>
    <title>Birthday Invitation</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#ffe6f2;
            margin-top:100px;
        }

        h1{
            color:#ff1493;
        }

        .container{
            position:relative;
            height:300px;
        }

        button{
            padding:12px 25px;
            font-size:18px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            margin:10px;
        }

        #yes{
            background:#28a745;
            color:white;
        }

        #no{
            background:#dc3545;
            color:white;
            position:absolute;
        }
    </style>
</head>
<body>

    <h1>🎂 Can you spend your Birthday with me, Arch. Alex? ❤️</h1>

    <div class="container">
        <button id="yes" onclick="accepted()">Yes ❤️</button>
        <button id="no">No 😅</button>
    </div>

    <script>
        const noBtn = document.getElementById("no");

        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * 300;
            const y = Math.random() * 200;

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        function accepted(){
            document.body.innerHTML = `
                <h1 style="color:#ff1493;">
                Yaaay! ❤️<br>
                See you on your Birthday, Arch. Alex! 🎂🌹
                </h1>
            `;
        }
    </script>

</body>
</html>
