<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Invite</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
    background:#ff9ec4;
}

button{
    padding:15px 25px;
    font-size:20px;
    margin:10px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

#no{
    position:absolute;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.modal-content img{
    width:300px;
    border-radius:10px;
}
</style>
</head>

<body>

<button id="yes">YES ❤️</button>
<button id="no">NO 😅</button>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2>YAY! 🎉</h2>
        <p>Thank you! 💕</p>

        <!-- IMPORTANT IMAGE -->
        <img src="./itinerary.jpg" alt="itinerary">
    </div>
</div>

<script>
// YES button → show popup
document.getElementById("yes").onclick = function(){
    document.getElementById("modal").style.display = "flex";
};

// NO button runaway
document.getElementById("no").addEventListener("mouseover", function(){
    this.style.left = Math.random()*300 + "px";
    this.style.top = Math.random()*300 + "px";
});
</script>

</body>
</html>
